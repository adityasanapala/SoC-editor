<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SoC Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>SoC Editor</h1>

    <div class="actions">
      <button id="clearBtn">
        Clear
      </button>
    </div>
  </header>

  <main>

    <textarea
      id="editor"
      placeholder="Start typing your notes here..."
    ></textarea>

  </main>

  <footer>
    <span id="wordCount">
      Words: 0
    </span>
  </footer>

  <script src="renderer.js"></script>

</body>
</html>
