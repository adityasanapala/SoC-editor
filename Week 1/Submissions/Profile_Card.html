<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body{
            background-color: #e0f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
        }
        .profile-card{
            background-color: #f0f0f0;
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
        }
        #profile-pic{
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
        img{
            width: 150px;
            height: 150px;
            border-radius: 50%;
            margin-bottom: 20px;
        }
        #profile-name{
            color: #333333;
            text-align: center;
            margin-bottom: 10px;
            padding: 0 20px;
        }
        p{
            color: #555555;
            line-height: 1.6;
            padding: 0 20px;
            margin-bottom: 20px;
        }
        a{
            display: inline-block;
            padding: 10px 20px;
            margin-left: 200px;
            background-color: #00796b;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
        }
        a:hover{
            background-color: #004d40;
        }
        </style>
</head>
<body>
    <div class="profile-card">
    <img src="Profile.jpg" alt="Profile Picture" id="profile-pic">
    <h1 id = "profile-name">Sai Balaji</h1>
    <p>To-be thirdie Aerospace, interested in Aerodynamics and Control systems.</p>
    <a href="https://github.com/SaiBalajiSonga">Github</a>
    </div>
</body>
</html>
